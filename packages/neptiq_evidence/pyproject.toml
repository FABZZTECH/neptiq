[project]
name = "neptiq-evidence"
version = "0.1.0"
description = "Evidence ledger writers, provenance construction, forward/backward traceability."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "neptiq-db",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_evidence"]

[tool.uv.sources]
neptiq-core = { workspace = true }
neptiq-db = { workspace = true }
