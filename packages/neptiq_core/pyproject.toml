[project]
name = "neptiq-core"
version = "0.1.0"
description = "Settings, typed errors, uuidv7 identifiers, structured logging, taint-free primitives."
requires-python = "==3.13.*"
dependencies = [
    "pydantic==2.11.7",
    "pydantic-settings==2.8.1",
    "uuid-utils==0.10.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_core"]

[tool.uv.sources]

