[project]
name = "neptiq-llm"
version = "0.1.0"
description = "ModelRouter gateway client, versioned prompts, eval harness. Never imported by rules."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "neptiq-security",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_llm"]

[tool.uv.sources]
neptiq-core = { workspace = true }
neptiq-security = { workspace = true }
