[project]
name = "neptiq-db"
version = "0.1.0"
description = "SQLAlchemy models, async session, RLS session binding helpers, repositories."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "sqlalchemy[asyncio]==2.0.38",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "pgvector==0.3.6",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_db"]

[tool.uv.sources]
neptiq-core = { workspace = true }
