[project]
name = "neptiq-queue"
version = "0.1.0"
description = "Postgres SKIP LOCKED job queue and crawl frontier: leases, reaper, DLQ."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "neptiq-db",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_queue"]

[tool.uv.sources]
neptiq-core = { workspace = true }
neptiq-db = { workspace = true }
