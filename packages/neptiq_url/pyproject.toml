[project]
name = "neptiq-url"
version = "0.1.0"
description = "Pure URL normalisation. Property-tested, must be injective on the fixture corpus."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "idna==3.10",
    "w3lib==2.3.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_url"]

[tool.uv.sources]
neptiq-core = { workspace = true }
