[project]
name = "neptiq-robots"
version = "0.1.0"
description = "Dual-agent robots.txt evaluation: NeptiqBot (may we fetch) and Googlebot (is it a finding)."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "neptiq-url",
    "protego==0.4.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_robots"]

[tool.uv.sources]
neptiq-core = { workspace = true }
neptiq-url = { workspace = true }
