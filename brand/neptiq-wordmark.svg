    <g transform="translate(0,0)">
      <rect x="0" y="0" width="10" height="60"/>
      <rect x="34" y="0" width="10" height="60"/>
      <path d="M0,0 L10,0 L44,60 L34,60 Z"/>
    </g>
    <!-- E : x offset 58, width 32 -->
    <g transform="translate(58,0)">
      <rect x="0" y="0" width="10" height="60"/>
      <rect x="0" y="0" width="32" height="10"/>
      <rect x="0" y="25" width="26" height="10"/>
