[project]
name = "neptiq-api"
version = "0.1.0"
description = "NEPTIQ API service — FastAPI, OpenAPI 3.1, RLS session binding, idempotency."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "neptiq-db",
    "neptiq-url",
    "neptiq-security",
    "neptiq-evidence",
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.11.7",
    "argon2-cffi==23.1.0",
    "pyotp==2.9.0",
    "redis==5.2.1",
    "itsdangerous==2.2.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_api"]

[tool.uv.sources]
neptiq-core = { workspace = true }
neptiq-db = { workspace = true }
neptiq-url = { workspace = true }
neptiq-security = { workspace = true }
neptiq-evidence = { workspace = true }
