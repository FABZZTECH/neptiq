; NEPTIQ — Alembic configuration.
;
; ARCHITECTURE §4: "Migrations | Alembic, forward-only, expand/contract".
; ARCHITECTURE §8: "No RLS-bypass role for application code; only migrations
; run as owner." Migrations connect via DATABASE_URL_MIGRATOR (neptiq_migrator
; role), never DATABASE_URL (neptiq_app, NOBYPASSRLS) — see db/env.py, which
; reads the migrator URL from the environment rather than from this file, so
; no credential is ever committed.
;
; Invoked as: uv run alembic -c db/alembic.ini upgrade head  (see Makefile)

[alembic]
script_location = %(here)s/migrations

# Timestamp-prefixed revision files sort chronologically in a directory
# listing, which matters once there are more than a handful.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally ABSENT. db/migrations/env.py resolves the
# connection from DATABASE_URL_MIGRATOR (falling back to DATABASE_URL) at
# runtime. Invariant 6: no hostname is hardcoded in source, and that includes
; this config file.
prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
