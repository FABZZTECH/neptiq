[project]
name = "neptiq-llm-gateway"
version = "0.1.0"
description = "ModelRouter, provider adapters, budgets, response cache, circuit breakers."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "neptiq-security",
    "neptiq-llm",
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "redis==5.2.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_llm_gateway"]

[tool.uv.sources]
neptiq-core = { workspace = true }
neptiq-security = { workspace = true }
neptiq-llm = { workspace = true }
