[project]
name = "neptiq-worker-renderer"
version = "0.1.0"
description = "ZONE U — isolated Playwright/Chromium pool. No DB credentials, no secrets."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "neptiq-url",
    "neptiq-security",
    "playwright==1.50.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_worker_renderer"]

[tool.uv.sources]
neptiq-core = { workspace = true }
neptiq-url = { workspace = true }
neptiq-security = { workspace = true }
