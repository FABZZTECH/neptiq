[project]
name = "neptiq-worker-fetcher"
version = "0.1.0"
description = "ZONE U — HTTP fetch through the egress proxy. No DB credentials, no secrets."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "neptiq-url",
    "neptiq-robots",
    "neptiq-security",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_worker_fetcher"]

[tool.uv.sources]
neptiq-core = { workspace = true }
neptiq-url = { workspace = true }
neptiq-robots = { workspace = true }
neptiq-security = { workspace = true }
