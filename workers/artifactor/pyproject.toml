[project]
name = "neptiq-worker-artifactor"
version = "0.1.0"
description = "ZONE T — artifact generation plus deterministic validators."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "neptiq-db",
    "neptiq-llm",
    "neptiq-evidence",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_worker_artifactor"]

[tool.uv.sources]
neptiq-core = { workspace = true }
neptiq-db = { workspace = true }
neptiq-llm = { workspace = true }
neptiq-evidence = { workspace = true }
