[project]
name = "neptiq-worker-parser"
version = "0.1.0"
description = "ZONE U — extraction. No DB credentials, no secrets."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "neptiq-url",
    "neptiq-extract",
    "neptiq-security",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_worker_parser"]

[tool.uv.sources]
neptiq-core = { workspace = true }
neptiq-url = { workspace = true }
neptiq-extract = { workspace = true }
neptiq-security = { workspace = true }
