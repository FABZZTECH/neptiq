[project]
name = "neptiq-worker-connector"
version = "0.1.0"
description = "ZONE T — GSC, CrUX, SERP adapters."
requires-python = "==3.13.*"
dependencies = [
    "neptiq-core",
    "neptiq-db",
    "neptiq-evidence",
    "neptiq-security",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptiq_worker_connector"]

[tool.uv.sources]
neptiq-core = { workspace = true }
neptiq-db = { workspace = true }
neptiq-evidence = { workspace = true }
neptiq-security = { workspace = true }
